name: codex-lane-gates

# Gates für jede codex/*-Lane: der Beweis-Loop für autonome Agenten.
# Muse (Metamuse Spark) pusht auf codex/*, diese Pipeline läuft automatisch,
# Muse liest das Ergebnis und fixiert bis grün. Integration in
# codex/m1-wave-02 erfolgt weiterhin manuell durch Mikail.
#
# Der E2E-Job ist seit dem Welle-03-Gatefix (2026-09-04, 90/90 gruen)
# BLOCKIEREND: die zwei vorbestehenden F7-Fehler sind an der Wurzel
# behoben (f7-02-Remount/Root-Cause, f7-03-Projektisolierung) und die
# vier neuen Specs sind Teil der Suite.

on:
  push:
    branches:
      - "codex/**"
    # Kostenoptimierung: reine Doku-/State-Commits (Muse schreibt je Turn
    # GOAL/LOOP-LOG) brauchen keine Gate-Laeufe — spart CI-Minuten.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Statik, DB-Tests, Rollenproben, Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Repo-Konvention: Scripts müssen aktiv sein (sonst EALLOWSCRIPTS);
      # siehe .npmrc und docs/parity/RUNBOOK.md.
      - name: Installieren
        run: env -u npm_config_allow_scripts npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Katalog-Import-Vertrag
        run: npm run contract:catalog-import

      - name: Dependency-Cruiser
        run: npm run depcruise

      - name: Chromium für Renderer-Tests bereitstellen
        # Die PDF-/Release-Renderer-Vitest-Tests (m202/m203a) rendern mit
        # page.pdf über einen echten Headless-Browser — ohne Chromium
        # laufen sie in der Gates-Job rot (auf Mikails Maschine grün,
        # weil dort installiert). Deshalb vor der Testsuite installieren.
        run: npx playwright install --with-deps chromium

      - name: Chromium-Userns eng für Renderer-Tests freigeben
        shell: bash
        run: |
          set -euo pipefail
          # chromium.executablePath() zeigt auf Chrome-for-Testing. Ein
          # headless:true-Launch ohne channel startet in Playwright 1.62 aber
          # den separaten chromium-headless-shell. Das AppArmor-Attachment muss
          # exakt diese tatsächlich gestartete Binärdatei treffen.
          chromium_headless_path="$(node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { chromium } = require("playwright");

          const playwrightCoreRoot = path.dirname(
            require.resolve("playwright-core/package.json"),
          );
          const manifest = JSON.parse(
            fs.readFileSync(path.join(playwrightCoreRoot, "browsers.json"), "utf8"),
          );
          const chromiumDescriptor = manifest.browsers.find(
            (entry) => entry.name === "chromium",
          );
          const headlessDescriptor = manifest.browsers.find(
            (entry) => entry.name === "chromium-headless-shell",
          );
          if (!chromiumDescriptor || !headlessDescriptor) {
            throw new Error("Playwright-Browsermanifest ist unvollständig.");
          }

          const chromiumPath = chromium.executablePath();
          const marker = `${path.sep}chromium-${chromiumDescriptor.revision}${path.sep}`;
          const markerIndex = chromiumPath.indexOf(marker);
          if (markerIndex < 0) {
            throw new Error("Playwright-Cachewurzel kann nicht bestimmt werden.");
          }
          const cacheRoot = chromiumPath.slice(0, markerIndex);
          const executableTail = process.arch === "x64"
            ? ["chrome-headless-shell-linux64", "chrome-headless-shell"]
            : process.arch === "arm64"
              ? ["chrome-linux", "headless_shell"]
              : null;
          if (process.platform !== "linux" || !executableTail) {
            throw new Error(`Nicht unterstützte CI-Plattform: ${process.platform}/${process.arch}`);
          }
          const executablePath = path.join(
            cacheRoot,
            `chromium_headless_shell-${headlessDescriptor.revision}`,
            ...executableTail,
          );
          if (!fs.existsSync(executablePath)) {
            throw new Error(`Chromium Headless Shell fehlt: ${executablePath}`);
          }
          process.stdout.write(executablePath);
          NODE
          )"
          if [[ ! -x "$chromium_headless_path" ]]; then
            echo "::error::Playwright Chromium Headless Shell ist nicht ausführbar: $chromium_headless_path"
            exit 1
          fi

          sudo tee /etc/apparmor.d/playwright-renderer-chromium >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile playwright-renderer-chromium "$chromium_headless_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/playwright-renderer-chromium

          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              chromiumSandbox: true,
            });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Testsuite (Vitest mit eingebettetem Postgres)
        run: npm run test
        env:
          NODE_ENV: test

      - name: Rollenproben (88/88 + PG18 5/5)
        run: npm run db:roles:verify
        env:
          NODE_ENV: test

      - name: Schema-Drift
        run: |
          printf 'y\n' | npm run db:generate
          if ! git diff --quiet -- drizzle/; then
            echo "::error::db:generate hat Schema-Drift erzeugt — Snapshot/Journal nachziehen."
            git diff --stat -- drizzle/
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PHASE: phase-production-build
          # Platzhalter ist bewusst KEIN Secret (lib/env.ts erlaubt ihn nur
          # in der Build-Phase) — siehe auth:generate-Script in package.json.
          BETTER_AUTH_SECRET: ci-build-platzhalter-kein-echtes-secret

      - name: Testergebnisse als Artefakt (Loop-Observability)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-result
          path: test-results/vitest-result.json
          if-no-files-found: warn

  e2e:
    name: Chromium-E2E (blockierend, 90/90)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installieren
        run: env -u npm_config_allow_scripts npm ci

      - name: Chromium bereitstellen
        run: npx playwright install --with-deps chromium

      - name: E2E-Suite (isolierte M1-06-Umgebung)
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Playwright-Ergebnisse als Artefakt (Loop-Observability)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/e2e/
          if-no-files-found: warn
