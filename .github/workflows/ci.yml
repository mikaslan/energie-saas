name: ci
# Kostenoptimierung (2026-09-05): dieser historische Workflow
# dupliziert die codex-lane-gates und lief nie gruen (Billing).
# Er bleibt als manuelles Artefakt erhalten; die codex/*-Gates
# traegt ausschliesslich codex-lane-ci.yml.
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # NIE der Superuser hier: scripts/migrate.mts bricht mit einem
      # Superuser/BYPASSRLS-Verbindungsstring hart ab (RLS-Safety-Gate), und
      # selbst ohne dieses Gate wären die RLS-Tests wirkungslos, weil ein
      # Superuser Row Level Security IMMER umgeht — auch mit FORCE ROW LEVEL
      # SECURITY (das schützt nur den Tabellen-Owner, sofern dieser kein
      # Superuser ist). app_ci ist nosuperuser/nobypassrls und Owner von
      # app_test, analog zur embedded-postgres-Testrolle in
      # tests/setup/embedded-postgres.ts (dort "app_test").
      POSTGRES_URL_TEST: postgres://app_ci:ci@localhost:5432/app_test
      POSTGRES_TEST_TARGET_CONFIRM: localhost:5432/app_test:ALLOW-DESTRUCTIVE-TESTS
      # Getrennte Superuser-Verbindung auf DIESELBE Datenbank. Wird
      # ausschließlich von tests/setup/superuser-db.ts für Aussagen benutzt,
      # die unter RLS strukturell nicht prüfbar sind (Zeilen, die außerhalb
      # jedes Mandantenkontexts geschrieben wurden — z. B. der Auth-Hook beim
      # Erst-Login). NIE als POSTGRES_URL/POSTGRES_URL_TEST verwenden: ein
      # Superuser umgeht RLS bedingungslos und würde alle RLS-Tests
      # wirkungslos machen.
      POSTGRES_URL_TEST_SUPERUSER: postgres://postgres:test@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Schema-Drift — jede Schemaänderung braucht eine Migration
        # Codex-Review #27: "npm run check" migriert nur VORHANDENES SQL und
        # generiert nichts. Eine neue Drizzle-Tabelle ohne zugehörige Migration
        # existiert in der Test-DB also gar nicht — sie ist für die
        # Tenant-Invarianten (RLS, workspace_id, Fixture-Pflicht) unsichtbar und
        # könnte grün durchmergen. Deshalb: generieren und danach einen
        # unveränderten Baum erzwingen.
        run: |
          npm run db:generate
          git diff --exit-code drizzle/ lib/db/schema/ \
            || { echo "::error::Schema geändert, aber keine Migration committet — 'npm run db:generate' ausführen und das Ergebnis mitcommitten."; exit 1; }
      - name: Nicht-superuser Test-Rolle + Datenbank bootstrappen
        # postgresql-client (psql) ist auf den GitHub-hosted ubuntu-latest
        # Runnern vorinstalliert. Läuft VOR "npm run check", damit
        # POSTGRES_URL_TEST oben schon auf eine existierende, RLS-taugliche
        # Rolle zeigt, wenn globalSetup (tests/setup/global-setup.ts) sie
        # unverändert übernimmt und scripts/migrate.mts dagegen migriert.
        run: |
          # createrole + Ownership von "public": drizzle/0015 legt die
          # Definer-Rolle identity_reconciler an und übergibt ihr die
          # SECURITY-DEFINER-Funktion. Beides spiegelt ADR 0003 Block 1/2 und
          # ist für die RLS-Zusage unbedenklich: seit PG 16 kann eine
          # CREATEROLE-Rolle weder SUPERUSER noch BYPASSRLS verleihen, wenn sie
          # es nicht selbst hat — das Gate in scripts/migrate.mts bleibt scharf.
          psql "postgres://postgres:test@localhost:5432/postgres" \
            -c "create role app_ci login password 'ci' nosuperuser nobypassrls createrole;" \
            -c "create role app_membership_writer nologin noinherit nosuperuser nobypassrls nocreatedb nocreaterole noreplication;" \
            -c "grant app_membership_writer to app_ci with admin false, inherit false, set false;" \
            -c "create database app_test owner app_ci;"
          psql "postgres://postgres:test@localhost:5432/app_test" \
            -c "alter schema public owner to app_ci;" \
            -c "grant all privileges on schema public to app_ci;"
      - run: npm run check
      - name: Produktionsbuild
        # Ohne dieses Gate blieb ein kaputter `next build` seit M0 unbemerkt, waehrend
        # lint/typecheck/depcruise/test durchgehend gruen meldeten: `npm run check`
        # fuehrt keinen Build aus, und der Fehler entstand erst beim "Collecting page
        # data", also beim Import der Route-Module durch Next.
        #
        # Die Env-Werte hier sind bewusst Wegwerf-Platzhalter. Der Build darf sie nicht
        # brauchen — er darf beim Import keine DB-Verbindung und keine Auth-Instanz
        # konstruieren. Sie stehen nur da, damit ein kuenftiger Fail-Fast-Guard (der
        # ein fehlendes Secret in Produktion korrekt verweigert) den CI-Build nicht
        # faelschlich rot macht. Wird der Build ohne sie gruen, koennen sie weg.
        env:
          # Kanonische Platzhalter-Kennung und Laufzeit-Blockade: lib/env.ts.
          BETTER_AUTH_SECRET: ci-build-platzhalter-kein-echtes-secret
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build
      - name: Worker-Compose validieren
        env:
          POSTGRES_URL_WORKER: postgres://app_worker:ci@db.invalid:5432/ci?sslmode=verify-full
          POSTGRES_EXPECTED_NEON_TENANT_ID: ci-neon-tenant-placeholder
          POSTGRES_EXPECTED_NEON_TIMELINE_ID: ci-neon-timeline-placeholder
        run: docker compose -f worker/compose.yaml config --quiet
      - name: Worker-Image tatsächlich bauen
        run: docker build -f worker/Dockerfile -t energie-saas-worker:ci .
