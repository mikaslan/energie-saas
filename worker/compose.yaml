# worker/compose.yaml — läuft auf dem Hetzner-Host
services:
  worker:
    build: { context: .., dockerfile: worker/Dockerfile }
    restart: always
    # 15 s pg-boss-Drain + bis zu 17 s failWip-DB-Timeout + Sentry/Socket-Close.
    # 60 s verhindert SIGKILL mitten in der expliziten Jobfreigabe.
    stop_grace_period: 60s
    environment:
      - NODE_ENV=production
      - DB_ROLE_MODE=strict
      - POSTGRES_URL_WORKER=${POSTGRES_URL_WORKER:?POSTGRES_URL_WORKER fehlt}
      - POSTGRES_EXPECTED_NEON_TENANT_ID=${POSTGRES_EXPECTED_NEON_TENANT_ID:?POSTGRES_EXPECTED_NEON_TENANT_ID fehlt}
      - POSTGRES_EXPECTED_NEON_TIMELINE_ID=${POSTGRES_EXPECTED_NEON_TIMELINE_ID:?POSTGRES_EXPECTED_NEON_TIMELINE_ID fehlt}
      # Monitoring-Gerüste (Tooling-Mission): leer = inaktiv, siehe .env.example
      - SENTRY_DSN=${SENTRY_DSN:-}
      - HEALTHCHECKS_PING_URL=${HEALTHCHECKS_PING_URL:-}
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
